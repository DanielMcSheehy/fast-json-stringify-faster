name: bench-cutoffs

on:
  push:
    branches: ['bench/**']

env:
  ROUNDS: '8'
  SIZES: '32,48,64,100,256,512,1000,10000,100000,300000,1000000'

jobs:
  ab:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
        candidate:
          - { name: pr-as-reviewed, ref: 395a410598933595b46e7f3edaa9c7dbd7ab6c20 }
          - { name: new-cutoffs, ref: f25152967b01af0926606155bcfa7fa56b1ff643 }
    name: node ${{ matrix.node }} / ${{ matrix.candidate.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: fastify/fast-json-stringify
          ref: main
          path: fjs-main
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.candidate.ref }}
          path: fjs-cand
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm i --no-package-lock --no-audit --no-fund
      - run: npm i --no-package-lock --no-audit --no-fund --omit=dev
        working-directory: fjs-main
      - run: npm i --no-package-lock --no-audit --no-fund --omit=dev
        working-directory: fjs-cand
      - name: A/B
        env:
          MAIN_DIR: fjs-main
          CAND_DIR: fjs-cand
        run: node benchmark/ci/ab.js "$ROUNDS" "$SIZES" | tee result.md
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.candidate.name }}-node${{ matrix.node }}
          path: result.md
